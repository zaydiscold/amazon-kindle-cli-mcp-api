name: Release autofix

on:
  push:
    branches: [release/twitter-ready-20260824]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/twitter-ready-20260824
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix MCP callback inference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mcp/src/server.ts')
          text = path.read_text()
          old = 'async (args) => response(await handler(args)),'
          new = 'async (args) => response(await handler(args as z.infer<z.ZodObject<Shape>>)),'
          if old not in text:
              raise SystemExit('MCP callback target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm format
      - name: Commit release fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli mcp scripts
          git commit -m "chore(release): format and stabilize MCP callback typing"
          git push origin HEAD:release/twitter-ready-20260824
