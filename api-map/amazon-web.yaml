{
  "openapi": "3.1.0",
  "info": {
    "title": "Amazon / Kindle HTTP Surface",
    "version": "0.3.1",
    "description": "Sanitized, HTTP-first map. CLI is the primary client; MCP is a thin engine projection. Browser/CDP may capture auth/contracts but is never a product transport."
  },
  "servers": [{ "url": "https://www.amazon.com" }],
  "paths": {
    "/s": {
      "get": {
        "summary": "Search Amazon catalog to resolve title/author to ASIN",
        "description": "Query `k`; CLI parses product cards and returns selected candidate + alternatives.",
        "x-mutatesAccount": false,
        "x-verification": "HTTP parser fixture + authenticated live search",
        "tags": ["catalog", "wishlist"]
      }
    },
    "/dp/{asin}": {
      "get": {
        "summary": "Fetch product / Add-to-List CSRF source",
        "description": "Extract anti-csrftoken-a2z from #addToWishListForm before list mutation.",
        "x-mutatesAccount": false,
        "tags": ["catalog", "wishlist"]
      }
    },
    "/hz/wishlist/ls": {
      "get": {
        "summary": "Wishlist index and named-list discovery",
        "description": "Resolve listName to listId; default / list-id page starts full queue walk.",
        "x-mutatesAccount": false,
        "tags": ["wishlist"]
      }
    },
    "/hz/wishlist/ls/{listId}": {
      "get": {
        "summary": "Wishlist first page",
        "description": "Parse cards and showMoreUrl/paginationToken.",
        "x-mutatesAccount": false,
        "tags": ["wishlist"]
      }
    },
    "/hz/wishlist/slv/items": {
      "get": {
        "summary": "Wishlist pagination",
        "description": "filter + paginationToken from showMoreUrl; repeat until no next token.",
        "x-mutatesAccount": false,
        "x-liveVerified": "2026-08-01",
        "tags": ["wishlist"]
      }
    },
    "/hz/wishlist/additemtolist": {
      "post": {
        "summary": "Add ASIN to named/default wishlist",
        "description": "Query ie=UTF8. Form: asin, vendorId=website.wishlist.detail.add, listType=wishlist, isAjax=1, optional listId. Header anti-csrftoken-a2z from product GET.",
        "x-mutatesAccount": true,
        "x-liveVerified": "2026-08-01",
        "tags": ["wishlist"]
      }
    },
    "/sendtokindle": { "get": { "summary": "Get Send-to-Kindle CSRF", "x-mutatesAccount": false, "tags": ["kindle"] } },
    "/sendtokindle/init": { "post": { "summary": "Initialize file upload", "x-mutatesAccount": true, "tags": ["kindle"] } },
    "/sendtokindle/upload": { "put": { "summary": "PUT bytes to presigned upload URL", "x-mutatesAccount": true, "tags": ["kindle"] } },
    "/sendtokindle/send-v2": { "post": { "summary": "Finalize Send-to-Kindle delivery", "x-mutatesAccount": true, "tags": ["kindle"] } },
    "/sendtokindle/recent-docs": { "get": { "summary": "Read Send-to-Kindle receipts", "x-mutatesAccount": false, "tags": ["kindle"] } },
    "/hz/mycd/digital-console/contentlist/booksAll/dateDsc/": { "get": { "summary": "Experimental: load MYCD purchased-Ebook shell and CSRF", "description": "Experimental / fixture-verified only; no authenticated live verification is claimed. CLI `kindle books` parses only the page-scoped CSRF, then calls the AJAX ownership route. Never emit shell tokens.", "x-mutatesAccount": false, "x-fixtureVerified": "2026-08-02", "tags": ["content"] } },
    "/hz/mycd/digital-console/contentlist/pdocs/dateDsc/": { "get": { "summary": "Experimental: load MYCD Personal Document shell and CSRF", "description": "Experimental / fixture-verified only; no authenticated live verification is claimed. CLI `kindle pdocs` parses only the page-scoped CSRF, then calls the AJAX ownership route. Never emit shell tokens or document content.", "x-mutatesAccount": false, "x-fixtureVerified": "2026-08-02", "tags": ["content"] } },
    "/hz/mycd/digital-console/ajax": { "post": { "summary": "Experimental: fetch paginated MYCD ownership metadata", "description": "Experimental / fixture-verified only; no authenticated live verification is claimed. Form: activity=GetContentOwnershipData, clientId=MYCD_WebService, csrfToken, activityInput JSON. `booksAll`/`Ebook` and `pdocs`/`KindlePDoc`; returned output is bounded metadata only (no URLs/content/secrets).", "x-mutatesAccount": false, "x-fixtureVerified": "2026-08-02", "tags": ["content"] } },
    "/hz/mycd/myx": { "get": { "summary": "Manage Your Content root", "x-mutatesAccount": false, "tags": ["content"] } },
    "/gp/digital/fiona/manage": { "get": { "summary": "Legacy device management", "x-mutatesAccount": false, "tags": ["content"] } }
  }
}
